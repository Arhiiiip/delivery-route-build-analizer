openapi: 3.0.3
info:
  title: General API
  version: 1.0.0
  description: OpenAPI спецификация для GeneralController

paths:
  /getApiKey:
    post:
      summary: Получить API-ключ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyRequest'
      responses:
        '200':
          description: Успешно получен API-ключ
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Ошибка сервера

  /createUser:
    post:
      summary: Создать пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: Успешно создан пользователь
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '500':
          description: Ошибка сервера

  /search:
    post:
      summary: Поиск продуктов
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Результат поиска
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '500':
          description: Ошибка сервера

components:
  schemas:
    ApiKeyRequest:
      type: object
      properties:
        companyName:
          type: string
      required:
        - companyName

    CreateUserRequest:
      type: object
      properties:
        login:
          type: string
        apiKey:
          type: string
      required:
        - login
        - apiKey

    SearchRequest:
      type: object
      properties:
        query:
          type: string
        minPrice:
          type: number
          format: double
        maxPrice:
          type: number
          format: double
        currency:
          type: string
          example: "RUB"
        apiKey:
          type: string
        loginUser:
          type: string
        companyName:
          type: string
        priority:
          type: string
          example: "HIGH"
        userRequirement:
          type: string
      required:
        - query
        - minPrice
        - maxPrice
        - currency
        - apiKey
        - loginUser
        - companyName
        - priority
        - userRequirement

    ProductResponse:
      type: object
      properties:
        recommendedProduct:
          $ref: '#/components/schemas/ProductWithRoutes'
        deliveryRoute:
          type: array
          items:
            type: string
        estimatedCost:
          type: number
          format: float
        estimatedDays:
          type: integer
        recommendationReason:
          type: string
        recommendations:
          type: array
          items:
            $ref: '#/components/schemas/ProductRecommendation'
      required:
        - recommendedProduct
        - deliveryRoute
        - estimatedCost
        - estimatedDays
        - recommendationReason
        - recommendations

    ProductRecommendation:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/ProductWithRoutes'
        deliveryRoute:
          type: array
          items:
            type: string
        estimatedCost:
          type: number
          format: float
        estimatedDays:
          type: integer
        recommendationReason:
          type: string
        score:
          type: number
          format: float
      required:
        - product
        - deliveryRoute
        - estimatedCost
        - estimatedDays
        - recommendationReason
        - score

    ProductWithRoutes:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/Product'
        countryRoute:
          type: array
          items:
            type: string
        cost:
          type: integer
          format: int64
        logisticCompanyName:
          type: string
        hoursForDelivery:
          type: integer
          format: int64
      required:
        - product
        - countryRoute
        - cost
        - logisticCompanyName
        - hoursForDelivery

    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        currency:
          type: string
          example: "RUB"
      required:
        - id
        - name
        - price
        - currency
